    <script>
      // First-visit intro: cover the page before first paint so there is no flash of content.
      // The flag lives in sessionStorage, so internal navigation never replays the greeting.
      (function () {
        try {
          if (!sessionStorage.getItem('ky-intro-seen') && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
            document.documentElement.classList.add('is-intro');
          }
        } catch (e) { /* storage blocked: skip the intro */ }
