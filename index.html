<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1d20" />
    <meta name="description" content="Kyyinfinite — Ripki Dwi Putra, high school student exploring AI architecture and Python development." />
    <title>Kyyinfinite® — AI & Python Student Developer</title>
    <script>
      // First-visit intro: cover the page before first paint so there is no flash of content.
      // The flag lives in sessionStorage, so internal navigation never replays the greeting.
      (function () {
        try {
          if (!sessionStorage.getItem('ky-intro-seen') && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
            document.documentElement.classList.add('is-intro');
          }
        } catch (e) { /* storage blocked: skip the intro */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
